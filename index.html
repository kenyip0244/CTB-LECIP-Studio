  // Bind Stop search dropdown
  const stopInp = document.getElementById('inspStopSearch');
  const stopRes = document.getElementById('inspStopResults');
  stopInp.oninput = () => {
    const q = stopInp.value.trim().toLowerCase();
    if (!q) { stopRes.classList.add('hidden'); return; }
    const hits = allStops.filter(st =>
      st.nameTc.toLowerCase().includes(q) ||
      st.subTc.toLowerCase().includes(q) ||
      st.nameEn.toLowerCase().includes(q) ||
      st.numId.includes(q) ||
      st.routes.some(r => r.toLowerCase().includes(q))
    ).slice(0, 30);

    stopRes.classList.remove('hidden');
    stopRes.innerHTML = hits.length ? hits.map(st => {
      const already = rule.stopIds.includes(st.stopId);
      return `
        <button data-add-stop="${esc(st.stopId)}" class="w-full px-3 py-2 text-left hover:bg-blue-50 flex items-center justify-between gap-2 text-xs">
          <div class="min-w-0">
            <div class="font-bold text-slate-900 truncate">${esc(st.nameTc)} ${st.subTc ? `<span class="text-slate-500">[${esc(st.subTc)}]</span>` : ''} <span class="text-[#0052CC]">#${esc(st.numId)}</span></div>
            <div class="text-[11px] text-slate-500 truncate">${esc(st.routes.slice(0, 8).join(' / '))}</div>
          </div>
          <span class="px-2 py-0.5 rounded text-[11px] font-bold shrink-0 ${already ? 'bg-emerald-100 text-emerald-800' : 'bg-[#0052CC] text-white'}">${already ? '已加入' : '加入'}</span>
        </button>
      `;
    }).join('') : `<div class="p-3 text-center text-[11px] text-slate-400">找不到符合的車站</div>`;

    stopRes.querySelectorAll('[data-add-stop]').forEach(btn => {
      btn.onclick = () => {
        const sid = btn.dataset.addStop;
        if (!rule.stopIds.includes(sid)) {
          rule.stopIds.push(sid);
          rule.updatedAt = new Date().toISOString();
          saveDb();
          renderMainList();
          renderAudioInspector();
        }
      };
    });
  };

  // Bind Route Mode & Toggles
  body.querySelectorAll('[data-rmode]').forEach(b => {
    b.onclick = () => {
      rule.routeMode = b.dataset.rmode;
      rule.updatedAt = new Date().toISOString();
      saveDb();
      renderMainList();
      renderAudioInspector();
    };
  });
  body.querySelectorAll('[data-toggle-route]').forEach(b => {
    b.onclick = () => {
      const r = b.dataset.toggleRoute;
      rule.routes = rule.routes.includes(r) ? rule.routes.filter(x => x !== r) : [...rule.routes, r];
      rule.updatedAt = new Date().toISOString();
      saveDb();
      renderMainList();
      renderAudioInspector();
    };
  });
  body.querySelectorAll('[data-del-route]').forEach(b => {
    b.onclick = () => {
      rule.routes = rule.routes.filter(x => x !== b.dataset.delRoute);
      rule.updatedAt = new Date().toISOString();
      saveDb();
      renderMainList();
      renderAudioInspector();
    };
  });
  const btnManualR = document.getElementById('btnAddManualRoute');
  if (btnManualR) {
    btnManualR.onclick = () => {
      const val = (document.getElementById('manualRouteInput').value || '').trim().toUpperCase();
      if (!val) return;
      if (!rule.routes.includes(val)) rule.routes.push(val);
      rule.updatedAt = new Date().toISOString();
      saveDb();
      renderMainList();
      renderAudioInspector();
    };
  }

  // Bind Trip Mode & Toggles
  body.querySelectorAll('[data-tmode]').forEach(b => {
    b.onclick = () => {
      rule.tripMode = b.dataset.tmode;
      rule.updatedAt = new Date().toISOString();
      saveDb();
      renderMainList();
      renderAudioInspector();
    };
  });
  body.querySelectorAll('[data-toggle-tripname]').forEach(b => {
    b.onclick = () => {
      const tn = b.dataset.toggleTripname;
      rule.tripNames = rule.tripNames.includes(tn) ? rule.tripNames.filter(x => x !== tn) : [...rule.tripNames, tn];
      rule.updatedAt = new Date().toISOString();
      saveDb();
      renderMainList();
      renderAudioInspector();
    };
  });
  body.querySelectorAll('[data-del-tripname]').forEach(b => {
    b.onclick = () => {
      rule.tripNames = rule.tripNames.filter(x => x !== b.dataset.delTripname);
      rule.updatedAt = new Date().toISOString();
      saveDb();
      renderMainList();
      renderAudioInspector();
    };
  });
  const btnManualT = document.getElementById('btnAddManualTrip');
  if (btnManualT) {
    btnManualT.onclick = () => {
      const val = (document.getElementById('manualTripInput').value || '').trim();
      if (!val) return;
      if (!rule.tripNames.includes(val)) rule.tripNames.push(val);
      rule.updatedAt = new Date().toISOString();
      saveDb();
      renderMainList();
      renderAudioInspector();
    };
  }

  // Note & Buttons
  document.getElementById('inspNoteInput').onchange = (e) => {
    rule.note = e.target.value.trim();
    rule.updatedAt = new Date().toISOString();
    saveDb();
  };
  document.getElementById('btnClearRule').onclick = () => {
    delete studioDb.rules[selectedAudioPath];
    saveDb();
    showToast('已清除配對並退回未配對');
    renderMainList();
    renderAudioInspector();
  };
  document.getElementById('btnSaveRuleDone').onclick = () => {
    rule.note = (document.getElementById('inspNoteInput').value || '').trim();
    rule.updatedAt = new Date().toISOString();
    saveDb();
    showToast(rule.stopIds.length ? '已儲存並歸類至「已處理音檔」' : '已儲存（尚未選車站）');
    renderMainList();
    hideInspectorMobile();
  };
}

function selectMissingStopForInspector(stopId, contextTrip) {
  selectedMissingStopId = stopId;
  selectedAudioPath = '';
  renderMainList();
  renderMissingStopInspector(stopId, contextTrip);
  showInspectorMobile();
}

function renderMissingStopInspector(stopId, contextTrip) {
  const st = stopById.get(stopId);
  const titleEl = document.getElementById('inspectorTitle');
  const subEl = document.getElementById('inspectorSubtitle');
  const body = document.getElementById('inspectorBody');
  if (!st || !body) return;

  titleEl.textContent = `為車站指派音檔：${st.nameTc}`;
  subEl.textContent = `#${st.numId} ${st.nameEn}${contextTrip ? ` · 來自班次 ${contextTrip.name}` : ''}`;

  const renderAudioCandidates = (kw, onlyUnmatched) => {
    const q = String(kw || '').trim().toLowerCase();
    const list = audioManifest.filter(p => {
      if (studioDb.ignored[p]) return false;
      if (onlyUnmatched && isAudioProcessed(p)) return false;
      if (q && !p.toLowerCase().includes(q)) return false;
      return true;
    }).slice(0, 45);

    const box = document.getElementById('missingAudioCandidates');
    if (!box) return;
    box.innerHTML = list.length ? list.map(p => `
      <div class="p-2.5 flex items-center justify-between gap-2 hover:bg-slate-50">
        <div class="min-w-0 flex-1">
          <div class="text-xs font-bold text-slate-900 truncate">${esc(p.split('/').pop())}</div>
          <div class="text-[10px] text-slate-400 truncate">${esc(p)}</div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button data-play-btn="${esc(p)}" class="px-2 py-1 rounded bg-white border border-slate-300 text-[11px] font-bold">試聽</button>
          <button data-assign-audio="${esc(p)}" class="px-2.5 py-1 rounded bg-[#0D8A55] hover:bg-[#0A7045] text-white text-[11px] font-bold">綁定</button>
        </div>
      </div>
    `).join('') : `<div class="py-8 text-center text-xs text-slate-400">找不到符合的已上傳音檔</div>`;

    box.querySelectorAll('[data-play-btn]').forEach(b => b.onclick = () => togglePlayAudio(b.dataset.playBtn));
    box.querySelectorAll('[data-assign-audio]').forEach(b => {
      b.onclick = () => {
        const p = b.dataset.assignAudio;
        const r = ensureRule(p);
        if (!r.stopIds.includes(stopId)) r.stopIds.push(stopId);
        const limitTrip = document.getElementById('chkLimitContextTrip')?.checked;
        if (limitTrip && contextTrip) {
          r.routeMode = 'specific';
          if (!r.routes.includes(contextTrip.routeId)) r.routes.push(contextTrip.routeId);
          r.tripMode = 'specific';
          if (!r.tripNames.includes(contextTrip.name)) r.tripNames.push(contextTrip.name);
        }
        r.updatedAt = new Date().toISOString();
        saveDb();
        showToast(`已將 ${p.split('/').pop()} 綁定至 ${st.nameTc}`);
        renderMainList();
        renderMissingStopInspector(stopId, contextTrip);
      };
    });
    syncPlayerUi();
  };

  body.innerHTML = `
    <div class="bg-white rounded-xl border border-[#DCE2E9] p-3.5 space-y-2">
      <div class="text-xs font-black text-slate-900">${esc(st.nameTc)} ${st.subTc ? `<span class="text-slate-500 font-bold">[${esc(st.subTc)}]</span>` : ''}</div>
      <div class="text-[11px] text-slate-500">途經路線：${esc(st.routes.join(' / ') || '無')}</div>
      ${contextTrip ? `
        <label class="flex items-center gap-2 pt-1 text-xs font-bold text-slate-700 cursor-pointer">
          <input id="chkLimitContextTrip" type="checkbox" class="rounded accent-[#0052CC]" />
          只套用於目前班次「${esc(contextTrip.name)}」
        </label>
      ` : ''}
    </div>

    <div class="bg-white rounded-xl border border-[#DCE2E9] p-3.5 space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <h3 class="text-xs font-black text-slate-900">挑選已上傳音檔</h3>
        <label class="flex items-center gap-1.5 text-[11px] font-bold text-slate-600 cursor-pointer">
          <input id="chkOnlyUnmatched" type="checkbox" checked class="accent-[#0052CC]" />
          只看未配對音檔
        </label>
      </div>
      <input id="missingAudioSearch" type="text" value="${esc(st.nameTc)}" placeholder="搜尋音檔檔名（例如站號或中文名）..." class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-xs font-semibold outline-none focus:border-[#0052CC] focus:bg-white" />
      <div id="missingAudioCandidates" class="max-h-[380px] overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-lg"></div>
    </div>
  `;

  const searchInp = document.getElementById('missingAudioSearch');
  const onlyChk = document.getElementById('chkOnlyUnmatched');
  const refresh = () => renderAudioCandidates(searchInp.value, onlyChk.checked);
  searchInp.oninput = refresh;
  onlyChk.onchange = refresh;
  refresh();
}

function buildExportPayload() {
  const confirmed = {};
  const details = {};
  const rules = [];

  for (const [audioPath, rule] of Object.entries(studioDb.rules)) {
    if (studioDb.ignored[audioPath]) continue;
    if (!rule || !Array.isArray(rule.stopIds) || rule.stopIds.length === 0) continue;

    for (const rawId of rule.stopIds) {
      const sid = String(rawId).trim();
      const numId = sid.replace(/^0+/, '');
      if (!confirmed[sid]) confirmed[sid] = audioPath;
      if (numId && !confirmed[numId]) confirmed[numId] = audioPath;
    }

    const firstSt = stopById.get(rule.stopIds[0]);
    details[audioPath] = {
      stopId: rule.stopIds[0],
      stopIds: rule.stopIds,
      routeMode: rule.routeMode || 'all',
      routes: rule.routes || [],
      tripMode: rule.tripMode || 'all',
      tripNames: rule.tripNames || [],
      scope: rule.stopIds.length > 1 ? 'multi' : 'single',
      heardTc: firstSt?.nameTc || '',
      heardEn: firstSt?.nameEn || '',
      note: rule.note || ''
    };

    rules.push({
      audioPath,
      stopIds: rule.stopIds,
      routeMode: rule.routeMode || 'all',
      routes: rule.routes || [],
      tripMode: rule.tripMode || 'all',
      tripNames: rule.tripNames || [],
      note: rule.note || '',
      updatedAt: rule.updatedAt || new Date().toISOString()
    });
  }

  return {
    version: 4,
    updatedAt: new Date().toISOString(),
    confirmed,
    details,
    rules,
    tripNames: studioDb.customTrips || {}
  };
}

function downloadJson(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

async function publishToWebRepo() {
  const payload = buildExportPayload();
  if (payload.rules.length === 0) {
    showToast('目前沒有已處理音檔可發佈');
    return;
  }
  const token = getGhToken();
  if (!token) {
    downloadJson(payload, 'audio_mapping.json');
    showToast(`未設定 GitHub Token，已匯出 ${payload.rules.length} 條規則為 audio_mapping.json`);
    return;
  }
  try {
    showToast(`正在發佈 ${payload.rules.length} 條規則至 CTB-LECIP-Web...`);
    const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_WEB_REPO}/contents/data/audio_mapping.json`;
    const headers = {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    };
    const chk = await fetch(apiUrl, { headers });
    const sha = chk.ok ? (await chk.json()).sha : undefined;
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
    const put = await fetch(apiUrl, {
      method: 'PUT',
      headers,
      body: JSON.stringify({
        message: `Update audio_mapping.json from Studio (${payload.rules.length} rules)`,
        content: b64,
        sha
      })
    });
    if (!put.ok) {
      const err = await put.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${put.status}`);
    }
    showToast(`發佈成功！已同步 ${payload.rules.length} 條音檔規則至報站器`);
  } catch (e) {
    showToast('發佈失敗：' + e.message);
  }
}

async function safeFetchJson(url) {
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 14000);
    const r = await fetch(url, { signal: c.signal });
    clearTimeout(t);
    if (!r.ok) return null;
    return await r.json();
  } catch (_) {
    return null;
  }
}

function mergeMappingIntoDb(mapData) {
  if (!mapData || typeof mapData !== 'object') return;
  if (mapData.tripNames && typeof mapData.tripNames === 'object') {
    studioDb.customTrips = { ...mapData.tripNames, ...studioDb.customTrips };
  }
  if (Array.isArray(mapData.rules)) {
    for (const r of mapData.rules) {
      if (r.audioPath && !studioDb.rules[r.audioPath]) {
        studioDb.rules[r.audioPath] = {
          stopIds: Array.isArray(r.stopIds) ? r.stopIds : [],
          routeMode: r.routeMode || 'all',
          routes: Array.isArray(r.routes) ? r.routes : [],
          tripMode: r.tripMode || 'all',
          tripNames: Array.isArray(r.tripNames) ? r.tripNames : [],
          note: r.note || '',
          updatedAt: r.updatedAt || ''
        };
      }
    }
  } else if (mapData.details && typeof mapData.details === 'object') {
    for (const [path, info] of Object.entries(mapData.details)) {
      if (!studioDb.rules[path] && (info.stopId || (Array.isArray(info.stopIds) && info.stopIds.length))) {
        const ids = Array.isArray(info.stopIds) && info.stopIds.length
          ? info.stopIds
          : (Array.isArray(info.sharedStopIds) && info.sharedStopIds.length ? info.sharedStopIds : [info.stopId]);
        studioDb.rules[path] = {
          stopIds: ids.filter(Boolean).map(String),
          routeMode: info.routeMode || 'all',
          routes: Array.isArray(info.routes) ? info.routes : [],
          tripMode: info.tripMode || 'all',
          tripNames: Array.isArray(info.tripNames) ? info.tripNames : [],
          note: info.note || '',
          updatedAt: ''
        };
      }
    }
  }
}

async function loadRemoteData() {
  const container = document.getElementById('mainListContainer');
  if (container) container.innerHTML = `<div class="py-16 text-center text-xs font-bold text-slate-400">正在同步遠端音檔清單與車站資料...</div>`;

  const ts = Date.now();
  const [manifestData, stopsData, mapData, tripsData] = await Promise.all([
    safeFetchJson(`${getAudioBase()}/audio_manifest.json?v=${ts}`),
    safeFetchJson(`${getWebDataBase()}/stops.json?v=${ts}`),
    safeFetchJson(`${getWebDataBase()}/audio_mapping.json?v=${ts}`),
    safeFetchJson(`${getWebDataBase()}/trips.json?v=${ts}`)
  ]);

  audioManifest = Array.isArray(manifestData) ? manifestData.map(x => String(x).replace(/\\/g, '/')) : [];

  stopById.clear();
  stopsByNormName.clear();
  tripCatalog.clear();
  const routeSet = new Set();

  // Map optional trips.json metadata if present
  const tripMetaByKey = new Map();
  if (Array.isArray(tripsData)) {
    for (const t of tripsData) {
      const rId = String(t.routeId || t.route || '').replace(/^CTB-/i, '').toUpperCase();
      const bnd = String(t.bound || t.dir || 'O').toUpperCase();
      const stype = String(t.serviceType || t.service_type || '1');
      const key = `${rId}|${bnd}|${stype}`;
      const label = String(t.tripName || t.name || t.label || '').trim()
        || (t.destTc ? `${rId}-${cleanJoint(t.destTc)}-${stype}` : `${rId}-${bnd}-${stype}`);
      tripMetaByKey.set(key, { label, destTc: cleanJoint(t.destTc || '') });
    }
  }

  const rawStops = Array.isArray(stopsData) ? stopsData : [];
  for (const row of rawStops) {
    const sid = String(row.stopId || '').trim();
    if (!sid) continue;
    const numId = sid.replace(/^0+/, '') || '0';
    const rId = String(row.routeId || row.route || '').replace(/^CTB-/i, '').toUpperCase();
    const bnd = String(row.bound || row.dir || 'O').toUpperCase();
    const stype = String(row.serviceType || row.service_type || '1');
    const seq = Number(row.seq ?? row.stopSeq ?? 0);

    if (rId) routeSet.add(rId);

    if (!stopById.has(sid)) {
      const tc = cleanJoint(row.nameTc || '');
      const en = cleanJoint(row.nameEn || '');
      const subTc = cleanJoint(row.roadTc || row.locationTc || row.subTc || '');
      const obj = {
        stopId: sid, numId, nameTc: tc, subTc, nameEn: en,
        normTc: normText(tc), routesSet: new Set()
      };
      stopById.set(sid, obj);
    }
    if (rId) stopById.get(sid).routesSet.add(rId);

    if (rId) {
      const tKey = `${rId}|${bnd}|${stype}`;
      if (!tripCatalog.has(tKey)) {
        const meta = tripMetaByKey.get(tKey);
        const explicitName = String(row.tripName || row.trip_name || row.serviceName || '').trim();
        const destTc = cleanJoint(row.destTc || row.dest_tc || meta?.destTc || '');
        const defaultName = explicitName || meta?.label || (destTc ? `${rId}-${destTc}-${stype}` : `${rId}-${bnd === 'I' ? '回程' : '去程'}-${stype}`);
        tripCatalog.set(tKey, { tripKey: tKey, routeId: rId, bound: bnd, serviceType: stype, defaultName, destTc, stops: [] });
      }
      tripCatalog.get(tKey).stops.push({ seq, stopId: sid });
    }
  }

  // Finalize stops & sort trip stop sequences, derive terminus name if destTc was missing
  allStops = Array.from(stopById.values()).map(v => {
    const st = {
      stopId: v.stopId, numId: v.numId, nameTc: v.nameTc, subTc: v.subTc,
      nameEn: v.nameEn, normTc: v.normTc,
      routes: Array.from(v.routesSet).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
    };
    stopById.set(st.stopId, st);
    if (st.normTc) {
      if (!stopsByNormName.has(st.normTc)) stopsByNormName.set(st.normTc, []);
      stopsByNormName.get(st.normTc).push(st);
    }
    return st;
  }).sort((a, b) => a.numId.localeCompare(b.numId, undefined, { numeric: true }));

  for (const t of tripCatalog.values()) {
    t.stops.sort((a, b) => a.seq - b.seq);
    if (!t.destTc && t.stops.length > 0) {
      const lastStop = stopById.get(t.stops[t.stops.length - 1].stopId);
      if (lastStop && lastStop.nameTc && !tripMetaByKey.has(t.tripKey)) {
        t.destTc = lastStop.nameTc;
        t.defaultName = `${t.routeId}-${lastStop.nameTc}-${t.serviceType}`;
      }
    }
  }

  allRouteIds = Array.from(routeSet).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  mergeMappingIntoDb(mapData);
  renderAll();
}

function updateNavButtons() {
  document.querySelectorAll('[data-nav]').forEach(btn => {
    if (btn.dataset.nav === activeNav) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  });
}

function renderAll() {
  updateNavButtons();
  renderMainList();
  if (selectedAudioPath) renderAudioInspector();
}

function initEvents() {
  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.onclick = () => {
      activeNav = btn.dataset.nav;
      currentPage = 0;
      updateNavButtons();
      renderMainList();
    };
  });

  document.getElementById('mainSearchInput').oninput = () => { currentPage = 0; renderMainList(); };
  document.getElementById('audioScopeFilter').onchange = () => { currentPage = 0; renderMainList(); };
  document.getElementById('missingViewMode').onchange = () => { currentPage = 0; renderMainList(); };
  document.getElementById('missingTripSelect').onchange = (e) => { selectedMissingTripKey = e.target.value; renderMainList(); };
  document.getElementById('btnPrevPage').onclick = () => { if (currentPage > 0) { currentPage--; renderMainList(); } };
  document.getElementById('btnNextPage').onclick = () => { currentPage++; renderMainList(); };
  document.getElementById('btnCloseInspectorMobile').onclick = hideInspectorMobile;

  document.getElementById('btnAddCustomTrip').onclick = () => {
    const rId = (document.getElementById('newTripRouteInput').value || '').trim().toUpperCase();
    const name = (document.getElementById('newTripNameInput').value || '').trim();
    if (!name) { showToast('請輸入班次名稱'); return; }
    const key = `MANUAL|${rId || 'ALL'}|${Date.now()}`;
    studioDb.customTrips[key] = { name, routeId: rId, bound: 'O', serviceType: 'CUSTOM', isManual: true };
    document.getElementById('newTripRouteInput').value = '';
    document.getElementById('newTripNameInput').value = '';
    saveDb();
    showToast(`已新增路線班次：${name}`);
    renderMainList();
  };

  document.getElementById('btnRestoreIgnored').onclick = () => {
    const cnt = Object.keys(studioDb.ignored || {}).length;
    if (!cnt) { showToast('目前沒有已忽略音檔'); return; }
    studioDb.ignored = {};
    saveDb();
    showToast(`已復原 ${cnt} 個已忽略音檔`);
    renderAll();
  };

  document.getElementById('btnExportJson').onclick = () => {
    downloadJson(buildExportPayload(), 'audio_mapping.json');
    showToast('已匯出 audio_mapping.json');
  };
  document.getElementById('btnPublishWeb').onclick = publishToWebRepo;
  document.getElementById('btnReloadData').onclick = loadRemoteData;

  document.getElementById('importJsonInput').onchange = async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    try {
      const parsed = JSON.parse(await f.text());
      mergeMappingIntoDb(parsed);
      saveDb();
      showToast('已成功匯入對照表 JSON');
      renderAll();
    } catch (err) {
      showToast('匯入失敗：' + err.message);
    }
    e.target.value = '';
  };

  // Settings modal
  const sModal = document.getElementById('settingsModal');
  document.getElementById('btnOpenSettings').onclick = () => {
    document.getElementById('cfgAudioBase').value = getAudioBase();
    document.getElementById('cfgWebDataBase').value = getWebDataBase();
    document.getElementById('cfgGhToken').value = getGhToken();
    document.getElementById('cfgFbUrl').value = getFbUrl();
    sModal.classList.remove('hidden');
  };
  document.getElementById('btnCloseSettings').onclick = () => sModal.classList.add('hidden');
  document.getElementById('btnResetDefaults').onclick = () => {
    document.getElementById('cfgAudioBase').value = DEFAULT_AUDIO_BASE;
    document.getElementById('cfgWebDataBase').value = DEFAULT_WEB_DATA_BASE;
  };
  document.getElementById('btnSaveSettings').onclick = () => {
    localStorage.setItem(KEY_CFG_AUDIO, document.getElementById('cfgAudioBase').value.trim() || DEFAULT_AUDIO_BASE);
    localStorage.setItem(KEY_CFG_WEBDATA, document.getElementById('cfgWebDataBase').value.trim() || DEFAULT_WEB_DATA_BASE);
    localStorage.setItem(KEY_CFG_GH, document.getElementById('cfgGhToken').value.trim());
    localStorage.setItem(KEY_CFG_FB, document.getElementById('cfgFbUrl').value.trim());
    sModal.classList.add('hidden');
    startFbSyncLoop();
    loadRemoteData();
    showToast('設定已儲存並重新連線');
  };
}

function boot() {
  try {
    const raw = localStorage.getItem(KEY_STUDIO_DB);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        studioDb = {
          rules: parsed.rules || {},
          ignored: parsed.ignored || {},
          customTrips: parsed.customTrips || {}
        };
      }
    }
  } catch (_) {}

  initEvents();
  startFbSyncLoop();
  loadRemoteData();
}

boot();
</script>
