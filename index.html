async function runBatchUpload() {
  const token = getGhToken();
  if (!token) {
    document.getElementById('uploadModal').classList.add('hidden');
    document.getElementById('btnOpenSettings').click();
    showToast('請先填寫 GitHub Token（需具 repo 權限）');
    return;
  }

  const cat = document.getElementById('uploadCategorySel').value; // stops | welcome | announcements
  const convertMp3 = document.getElementById('uploadConvertMp3Chk').checked;
  const folderMap = { stops: 'audio/stops', welcome: 'audio/welcome', announcements: 'audio/announcements' };
  const targetFolder = folderMap[cat] || 'audio/stops';
  const btn = document.getElementById('btnStartUpload');
  const prog = document.getElementById('uploadProgressText');
  btn.disabled = true;

  const apiBase = `https://api.github.com/repos/${GH_OWNER}/${GH_AUDIO_REPO}/contents`;
  const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
  const uploadedPaths = [];

  try {
    for (let i = 0; i < pendingUploadFiles.length; i++) {
      const file = pendingUploadFiles[i];
      prog.textContent = `正在處理 (${i + 1}/${pendingUploadFiles.length})：${file.name}`;
      let outBlob = file;
      let outName = file.name.replace(/[\\/:*?"<>|]/g, '_');
      if (convertMp3) {
        outBlob = await transcodeToMp3Blob(file);
        outName = outName.replace(/\.[^.]+$/, '') + '.mp3';
      }
      const relPath = `${targetFolder}/${outName}`;
      const encodedApiPath = relPath.split('/').map(encodeURIComponent).join('/');

      const chk = await fetch(`${apiBase}/${encodedApiPath}`, { headers });
      const sha = chk.ok ? (await chk.json()).sha : undefined;
      const b64 = await blobToBase64(outBlob);

      const put = await fetch(`${apiBase}/${encodedApiPath}`, {
        method: 'PUT',
        headers,
        body: JSON.stringify({ message: `Upload ${relPath} from Studio`, content: b64, sha })
      });
      if (!put.ok) {
        const err = await put.json().catch(() => ({}));
        throw new Error(`${outName}: ${err.message || put.status}`);
      }

      localBlobUrls.set(relPath, URL.createObjectURL(outBlob));
      uploadedPaths.push(relPath);
      if (!audioManifest.includes(relPath)) audioManifest.unshift(relPath);
    }

    // Refresh & update audio_manifest.json on CTB-LECIP-Audio
    prog.textContent = '正在同步更新 audio_manifest.json...';
    const manRes = await fetch(`${apiBase}/audio_manifest.json`, { headers });
    let remoteManifest = [...audioManifest];
    let manSha;
    if (manRes.ok) {
      const manJson = await manRes.json();
      manSha = manJson.sha;
      try {
        const decoded = decodeURIComponent(escape(atob(manJson.content.replace(/\n/g, ''))));
        const parsed = JSON.parse(decoded);
        if (Array.isArray(parsed)) remoteManifest = parsed.map(x => String(x).replace(/\\/g, '/'));
      } catch (_) {}
    }
    const mergedSet = new Set([...remoteManifest, ...uploadedPaths]);
    const finalManifest = Array.from(mergedSet).sort();
    const manB64 = btoa(unescape(encodeURIComponent(JSON.stringify(finalManifest, null, 2))));
    await fetch(`${apiBase}/audio_manifest.json`, {
      method: 'PUT',
      headers,
      body: JSON.stringify({ message: `Register ${uploadedPaths.length} uploaded audio files`, content: manB64, sha: manSha })
    });

    audioManifest = finalManifest;
    pendingUploadFiles = [];
    document.getElementById('uploadModal').classList.add('hidden');

    if (cat === 'welcome' && uploadedPaths.length) {
      uploadedPaths.forEach(p => ensureWelcomeRule(p));
      saveDb();
      activeNav = 'welcome';
      selectWelcomeForInspector(uploadedPaths[0]);
    } else if (uploadedPaths.length) {
      activeNav = 'unmatched';
      document.getElementById('audioScopeFilter').value = cat === 'announcements' ? 'announcements' : 'stops';
      selectAudioForInspector(uploadedPaths[0]);
    }
    showToast(`成功上傳 ${uploadedPaths.length} 個音檔，已可即時試聽並綁定！`);
  } catch (e) {
    prog.textContent = '上傳失敗：' + e.message;
    showToast('上傳失敗：' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// ---------- Export & Publish ----------
function buildExportPayload() {
  const confirmed = {};
  const details = {};
  const rules = [];
  const welcomeRules = [];
  let defaultWelcome = '';

  for (const [audioPath, rule] of Object.entries(studioDb.rules)) {
    if (studioDb.ignored[audioPath]) continue;
    if (!rule || !Array.isArray(rule.stopIds) || rule.stopIds.length === 0) continue;
    for (const rawId of rule.stopIds) {
      const sid = String(rawId).trim();
      const numId = sid.replace(/^0+/, '');
      if (!confirmed[sid]) confirmed[sid] = audioPath;
      if (numId && !confirmed[numId]) confirmed[numId] = audioPath;
    }
    const firstSt = stopById.get(rule.stopIds[0]);
    details[audioPath] = {
      stopId: rule.stopIds[0], stopIds: rule.stopIds,
      routeMode: rule.routeMode || 'all', routes: rule.routes || [],
      tripMode: rule.tripMode || 'all', tripNames: rule.tripNames || [],
      scope: rule.stopIds.length > 1 ? 'multi' : 'single',
      heardTc: firstSt?.nameTc || '', heardEn: firstSt?.nameEn || '', note: rule.note || ''
    };
    rules.push({
      audioPath, stopIds: rule.stopIds,
      routeMode: rule.routeMode || 'all', routes: rule.routes || [],
      tripMode: rule.tripMode || 'all', tripNames: rule.tripNames || [],
      note: rule.note || '', updatedAt: rule.updatedAt || new Date().toISOString()
    });
  }

  for (const [audioPath, w] of Object.entries(studioDb.welcomeRules || {})) {
    if (studioDb.ignored[audioPath]) continue;
    if (w.scope === 'default' && !defaultWelcome) defaultWelcome = audioPath;
    welcomeRules.push({
      audioPath, scope: w.scope || 'default',
      routes: w.routes || [], tripNames: w.tripNames || [],
      note: w.note || '', updatedAt: w.updatedAt || new Date().toISOString()
    });
  }

  return {
    version: 5,
    updatedAt: new Date().toISOString(),
    confirmed,
    details,
    rules,
    defaultWelcome,
    welcomeRules,
    tripNames: studioDb.customTrips || {}
  };
}

function downloadJson(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

async function publishToWebRepo() {
  const payload = buildExportPayload();
  if (payload.rules.length === 0 && payload.welcomeRules.length === 0) {
    showToast('目前沒有已處理音檔或歡迎詞可發佈');
    return;
  }
  const token = getGhToken();
  if (!token) {
    downloadJson(payload, 'audio_mapping.json');
    showToast(`未設定 GitHub Token，已匯出 audio_mapping.json`);
    return;
  }
  try {
    showToast(`正在發佈 ${payload.rules.length} 條報站規則與 ${payload.welcomeRules.length} 條歡迎詞...`);
    const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_WEB_REPO}/contents/data/audio_mapping.json`;
    const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
    const chk = await fetch(apiUrl, { headers });
    const sha = chk.ok ? (await chk.json()).sha : undefined;
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
    const put = await fetch(apiUrl, {
      method: 'PUT',
      headers,
      body: JSON.stringify({ message: `Sync Studio mapping (${payload.rules.length} stops, ${payload.welcomeRules.length} welcome)`, content: b64, sha })
    });
    if (!put.ok) throw new Error((await put.json().catch(() => ({}))).message || `HTTP ${put.status}`);
    showToast('發佈成功！報站器已收到最新對照表與歡迎詞');
  } catch (e) {
    showToast('發佈失敗：' + e.message);
  }
}

async function safeFetchJson(url) {
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 14000);
    const r = await fetch(url, { signal: c.signal });
    clearTimeout(t);
    return r.ok ? await r.json() : null;
  } catch (_) { return null; }
}

function mergeMappingIntoDb(mapData) {
  if (!mapData || typeof mapData !== 'object') return;
  if (mapData.tripNames && typeof mapData.tripNames === 'object') {
    studioDb.customTrips = { ...mapData.tripNames, ...studioDb.customTrips };
  }
  if (Array.isArray(mapData.welcomeRules)) {
    for (const w of mapData.welcomeRules) {
      if (w.audioPath && !studioDb.welcomeRules[w.audioPath]) {
        studioDb.welcomeRules[w.audioPath] = {
          scope: w.scope || 'default', routes: Array.isArray(w.routes) ? w.routes : [],
          tripNames: Array.isArray(w.tripNames) ? w.tripNames : [], note: w.note || '', updatedAt: w.updatedAt || ''
        };
      }
    }
  }
  if (Array.isArray(mapData.rules)) {
    for (const r of mapData.rules) {
      if (r.audioPath && !studioDb.rules[r.audioPath]) {
        studioDb.rules[r.audioPath] = {
          stopIds: Array.isArray(r.stopIds) ? r.stopIds : [], routeMode: r.routeMode || 'all',
          routes: Array.isArray(r.routes) ? r.routes : [], tripMode: r.tripMode || 'all',
          tripNames: Array.isArray(r.tripNames) ? r.tripNames : [], note: r.note || '', updatedAt: r.updatedAt || ''
        };
      }
    }
  } else if (mapData.details && typeof mapData.details === 'object') {
    for (const [path, info] of Object.entries(mapData.details)) {
      if (!studioDb.rules[path] && (info.stopId || (Array.isArray(info.stopIds) && info.stopIds.length))) {
        const ids = Array.isArray(info.stopIds) && info.stopIds.length ? info.stopIds
          : (Array.isArray(info.sharedStopIds) && info.sharedStopIds.length ? info.sharedStopIds : [info.stopId]);
        studioDb.rules[path] = {
          stopIds: ids.filter(Boolean).map(String), routeMode: info.routeMode || 'all',
          routes: Array.isArray(info.routes) ? info.routes : [], tripMode: info.tripMode || 'all',
          tripNames: Array.isArray(info.tripNames) ? info.tripNames : [], note: info.note || '', updatedAt: ''
        };
      }
    }
  }
}

async function loadRemoteData() {
  const container = document.getElementById('mainListContainer');
  if (container) container.innerHTML = `<div class="py-16 text-center text-xs font-bold text-slate-400">正在載入遠端音檔清單與車站資料...</div>`;

  const ts = Date.now();
  const [manifestData, stopsData, mapData, tripsData] = await Promise.all([
    safeFetchJson(`${getAudioBase()}/audio_manifest.json?v=${ts}`),
    safeFetchJson(`${getWebDataBase()}/stops.json?v=${ts}`),
    safeFetchJson(`${getWebDataBase()}/audio_mapping.json?v=${ts}`),
    safeFetchJson(`${getWebDataBase()}/trips.json?v=${ts}`)
  ]);

  const remoteList = Array.isArray(manifestData) ? manifestData.map(x => String(x).replace(/\\/g, '/')) : [];
  audioManifest = Array.from(new Set([...Array.from(localBlobUrls.keys()), ...remoteList]));

  stopById.clear(); stopsByNormName.clear(); tripCatalog.clear();
  const routeSet = new Set();

  const tripMetaByKey = new Map();
  if (Array.isArray(tripsData)) {
    for (const t of tripsData) {
      const rId = String(t.routeId || t.route || '').replace(/^CTB-/i, '').toUpperCase();
      const bnd = String(t.bound || t.dir || 'O').toUpperCase();
      const stype = String(t.serviceType || t.service_type || '1');
      const key = `${rId}|${bnd}|${stype}`;
      const label = String(t.tripName || t.name || t.label || '').trim() || (t.destTc ? `${rId}-${cleanJoint(t.destTc)}-${stype}` : `${rId}-${bnd}-${stype}`);
      tripMetaByKey.set(key, { label, destTc: cleanJoint(t.destTc || '') });
    }
  }

  for (const row of (Array.isArray(stopsData) ? stopsData : [])) {
    const sid = String(row.stopId || '').trim();
    if (!sid) continue;
    const numId = sid.replace(/^0+/, '') || '0';
    const rId = String(row.routeId || row.route || '').replace(/^CTB-/i, '').toUpperCase();
    const bnd = String(row.bound || row.dir || 'O').toUpperCase();
    const stype = String(row.serviceType || row.service_type || '1');
    const seq = Number(row.seq ?? row.stopSeq ?? 0);
    if (rId) routeSet.add(rId);

    if (!stopById.has(sid)) {
      const tc = cleanJoint(row.nameTc || '');
      const en = cleanJoint(row.nameEn || '');
      const subTc = cleanJoint(row.roadTc || row.locationTc || row.subTc || '');
      stopById.set(sid, { stopId: sid, numId, nameTc: tc, subTc, nameEn: en, normTc: normText(tc), routesSet: new Set() });
    }
    if (rId) stopById.get(sid).routesSet.add(rId);

    if (rId) {
      const tKey = `${rId}|${bnd}|${stype}`;
      if (!tripCatalog.has(tKey)) {
        const meta = tripMetaByKey.get(tKey);
        const explicitName = String(row.tripName || row.trip_name || row.serviceName || '').trim();
        const destTc = cleanJoint(row.destTc || row.dest_tc || meta?.destTc || '');
        const defaultName = explicitName || meta?.label || (destTc ? `${rId}-${destTc}-${stype}` : `${rId}-${bnd === 'I' ? '回程' : '去程'}-${stype}`);
        tripCatalog.set(tKey, { tripKey: tKey, routeId: rId, bound: bnd, serviceType: stype, defaultName, destTc, stops: [] });
      }
      tripCatalog.get(tKey).stops.push({ seq, stopId: sid });
    }
  }

  allStops = Array.from(stopById.values()).map(v => {
    const st = {
      stopId: v.stopId, numId: v.numId, nameTc: v.nameTc, subTc: v.subTc, nameEn: v.nameEn, normTc: v.normTc,
      routes: Array.from(v.routesSet).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
    };
    stopById.set(st.stopId, st);
    if (st.normTc) {
      if (!stopsByNormName.has(st.normTc)) stopsByNormName.set(st.normTc, []);
      stopsByNormName.get(st.normTc).push(st);
    }
    return st;
  }).sort((a, b) => a.numId.localeCompare(b.numId, undefined, { numeric: true }));

  for (const t of tripCatalog.values()) {
    t.stops.sort((a, b) => a.seq - b.seq);
    if (!t.destTc && t.stops.length > 0) {
      const lastStop = stopById.get(t.stops[t.stops.length - 1].stopId);
      if (lastStop && lastStop.nameTc && !tripMetaByKey.has(t.tripKey)) {
        t.destTc = lastStop.nameTc;
        t.defaultName = `${t.routeId}-${lastStop.nameTc}-${t.serviceType}`;
      }
    }
  }

  allRouteIds = Array.from(routeSet).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  mergeMappingIntoDb(mapData);
  renderAll();
}

function updateNavButtons() {
  document.querySelectorAll('[data-nav]').forEach(btn => {
    if (btn.dataset.nav === activeNav) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  });
}

function renderAll() {
  updateNavButtons();
  renderMainList();
  if (selectedAudioPath) renderAudioInspector();
  else if (selectedWelcomePath) renderWelcomeInspector();
}

function openUploadModalWithCategory(cat = 'stops') {
  pendingUploadFiles = [];
  document.getElementById('uploadCategorySel').value = cat;
  document.getElementById('uploadFileInput').value = '';
  renderUploadQueue();
  document.getElementById('uploadModal').classList.remove('hidden');
}

function initEvents() {
  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.onclick = () => { activeNav = btn.dataset.nav; currentPage = 0; updateNavButtons(); renderMainList(); };
  });
  document.getElementById('mainSearchInput').oninput = () => { currentPage = 0; renderMainList(); };
  document.getElementById('audioScopeFilter').onchange = () => { currentPage = 0; renderMainList(); };
  document.getElementById('missingViewMode').onchange = () => { currentPage = 0; renderMainList(); };
  document.getElementById('missingTripSelect').onchange = (e) => { selectedMissingTripKey = e.target.value; renderMainList(); };
  document.getElementById('btnPrevPage').onclick = () => { if (currentPage > 0) { currentPage--; renderMainList(); } };
  document.getElementById('btnNextPage').onclick = () => { currentPage++; renderMainList(); };
  document.getElementById('btnCloseInspectorMobile').onclick = hideInspectorMobile;

  document.getElementById('btnOpenUpload').onclick = () => openUploadModalWithCategory(activeNav === 'welcome' ? 'welcome' : 'stops');
  document.getElementById('btnQuickUploadWelcome').onclick = () => openUploadModalWithCategory('welcome');
  document.getElementById('btnCloseUpload').onclick = () => document.getElementById('uploadModal').classList.add('hidden');
  document.getElementById('uploadFileInput').onchange = (e) => { pendingUploadFiles = Array.from(e.target.files || []); renderUploadQueue(); };
  const dz = document.getElementById('uploadDropZone');
  dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('border-[#0052CC]', 'bg-blue-50'); };
  dz.ondragleave = () => { dz.classList.remove('border-[#0052CC]', 'bg-blue-50'); };
  dz.ondrop = (e) => {
    e.preventDefault(); dz.classList.remove('border-[#0052CC]', 'bg-blue-50');
    pendingUploadFiles = Array.from(e.dataTransfer.files || []);
    renderUploadQueue();
  };
  document.getElementById('btnStartUpload').onclick = runBatchUpload;

  document.getElementById('btnAddCustomTrip').onclick = () => {
    const rId = (document.getElementById('newTripRouteInput').value || '').trim().toUpperCase();
    const name = (document.getElementById('newTripNameInput').value || '').trim();
    if (!name) { showToast('請輸入班次名稱'); return; }
    studioDb.customTrips[`MANUAL|${rId || 'ALL'}|${Date.now()}`] = { name, routeId: rId, bound: 'O', serviceType: 'CUSTOM', isManual: true };
    document.getElementById('newTripRouteInput').value = '';
    document.getElementById('newTripNameInput').value = '';
    saveDb(); showToast(`已新增班次：${name}`); renderMainList();
  };

  document.getElementById('btnRestoreIgnored').onclick = () => {
    const cnt = Object.keys(studioDb.ignored || {}).length;
    if (!cnt) { showToast('目前沒有已忽略音檔'); return; }
    studioDb.ignored = {}; saveDb(); showToast(`已復原 ${cnt} 個音檔`); renderAll();
  };

  document.getElementById('btnExportJson').onclick = () => { downloadJson(buildExportPayload(), 'audio_mapping.json'); showToast('已匯出 audio_mapping.json'); };
  document.getElementById('btnPublishWeb').onclick = publishToWebRepo;
  document.getElementById('btnReloadData').onclick = loadRemoteData;

  document.getElementById('importJsonInput').onchange = async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    try {
      mergeMappingIntoDb(JSON.parse(await f.text()));
      saveDb(); showToast('已匯入對照表 JSON'); renderAll();
    } catch (err) { showToast('匯入失敗：' + err.message); }
    e.target.value = '';
  };

  const sModal = document.getElementById('settingsModal');
  document.getElementById('btnOpenSettings').onclick = () => {
    document.getElementById('cfgAudioBase').value = getAudioBase();
    document.getElementById('cfgWebDataBase').value = getWebDataBase();
    document.getElementById('cfgGhToken').value = getGhToken();
    document.getElementById('cfgFbUrl').value = getFbUrl();
    sModal.classList.remove('hidden');
  };
  document.getElementById('btnCloseSettings').onclick = () => sModal.classList.add('hidden');
  document.getElementById('btnResetDefaults').onclick = () => {
    document.getElementById('cfgAudioBase').value = DEFAULT_AUDIO_BASE;
    document.getElementById('cfgWebDataBase').value = DEFAULT_WEB_DATA_BASE;
  };
  document.getElementById('btnSaveSettings').onclick = () => {
    localStorage.setItem(KEY_CFG_AUDIO, document.getElementById('cfgAudioBase').value.trim() || DEFAULT_AUDIO_BASE);
    localStorage.setItem(KEY_CFG_WEBDATA, document.getElementById('cfgWebDataBase').value.trim() || DEFAULT_WEB_DATA_BASE);
    localStorage.setItem(KEY_CFG_GH, document.getElementById('cfgGhToken').value.trim());
    localStorage.setItem(KEY_CFG_FB, document.getElementById('cfgFbUrl').value.trim());
    sModal.classList.add('hidden');
    startRealtimeSync();
    loadRemoteData();
    showToast('設定已儲存並啟用實時同步');
  };
}

function boot() {
  try {
    const raw = localStorage.getItem(KEY_STUDIO_DB) || localStorage.getItem('ctb_audio_studio_db_v1');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        studioDb = {
          rules: parsed.rules || {},
          welcomeRules: parsed.welcomeRules || {},
          ignored: parsed.ignored || {},
          customTrips: parsed.customTrips || {}
        };
      }
    }
  } catch (_) {}
  initEvents();
  startRealtimeSync();
  loadRemoteData();
}

boot();
</script>
